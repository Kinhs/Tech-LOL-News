# Days of items kept in the DB (and fetched). Unstarred older items are pruned.
keep_days = 30
# The Markdown digest only lists new items newer than this.
max_age_days = 2
# server.py refreshes all feeds this often.
refresh_minutes = 30

# An item gets EVERY topic whose keyword appears (whole word) in its title or summary.
# No hit -> the feed's own topic. Add topics freely; the UI picks them up.
[topics]
