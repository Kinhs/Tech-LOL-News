<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101722" media="(prefers-color-scheme: dark)">
<title>League News</title>
<link rel="stylesheet" href="/common.css">
<style>
html { scroll-padding-top: calc(var(--hdr) + 16px); }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; margin-left: 0; }
.seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed=true] { position: relative; z-index: 1; }

#views { max-width: 820px; margin: 0 auto; padding: 18px 20px 0; display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px 22px; }
#views .tab { border: 0; border-bottom: 2px solid transparent; border-radius: 0; padding: 6px 2px 8px; font-weight: 600; color: var(--muted); background: none; }
#views .tab[aria-pressed=true] { color: var(--text); border-bottom-color: var(--signal); background: none; }
#views .tab:hover { color: var(--text); }
#vfilter { margin-left: auto; margin-bottom: 6px; }
main { max-width: 820px; margin: 0 auto; padding: 14px 20px 40px; }

#to-top { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 9; background: var(--panel); box-shadow: 0 8px 24px rgba(0, 0, 0, .28); }
#to-top[hidden] { display: none; }
@media (max-width: 760px) { #to-top { right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); } }

/* Patch card */
.patch-card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px 18px; margin-bottom: 14px; }
.head { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
.title { font-family: var(--serif); font-weight: 600; font-size: 19px; line-height: 1.3; color: var(--text); text-decoration: none; overflow-wrap: anywhere; }
.title:hover { color: var(--signal); }
time { color: var(--muted); font-size: 13px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.kind { margin-top: 16px; }
.kind-h { display: flex; align-items: baseline; gap: 8px; font-weight: 700; font-size: 14px; }
.kind-h span { font-weight: 400; color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
.bar { display: flex; height: 8px; margin: 7px 0 5px; border-radius: 3px; overflow: hidden; background: var(--line); gap: 2px; }
.bar i { display: block; min-width: 4px; }
.bar .buff { background: var(--buff); } .bar .nerf { background: var(--nerf); } .bar .mixed { background: var(--mixed); } .bar .adjust { background: var(--muted); opacity: .55; }
.counts { color: var(--muted); font-size: 12.5px; margin-bottom: 8px; font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12.5px; padding: 2px 8px; border-radius: 4px; border-color: transparent; display: inline-flex; align-items: center; }
.chip.buff { background: var(--buff-bg); color: var(--buff); }
.chip.nerf { background: var(--nerf-bg); color: var(--nerf); }
.chip.mixed { background: var(--mixed-bg); color: var(--mixed); }
.chip.adjust { background: var(--line); color: var(--text); }
.chip.active { outline: 2px solid var(--signal); outline-offset: 1px; }
.ic { width: 16px; height: 16px; border-radius: 4px; margin-right: 5px; background: var(--line); object-fit: cover; flex: none; }
.ic.champions, .ic.runes { border-radius: 50%; }
.ic.runes { background: #0006; padding: 1px; }
.panel { background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 10px 14px; margin-top: 12px; }
.phead { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
.phead .ic { width: 22px; height: 22px; margin: 0; }
.badge { font-size: 11.5px; font-weight: 600; padding: 1px 7px; border-radius: 4px; }
.badge.buff { background: var(--buff-bg); color: var(--buff); } .badge.nerf { background: var(--nerf-bg); color: var(--nerf); }
.badge.mixed { background: var(--mixed-bg); color: var(--mixed); } .badge.adjust { background: var(--line); color: var(--text); }
.note { font-size: 12.5px; color: var(--muted); margin-bottom: 4px; }
.reason { margin: 6px 0 8px; color: var(--muted); font-size: 14px; max-width: 70ch; }
.change { font-size: 14px; margin: 3px 0; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.change .grp { color: var(--muted); }
.change .up { color: var(--buff); } .change .down { color: var(--nerf); }
details.patch { margin-top: 14px; }
details.patch > summary { cursor: pointer; color: var(--signal); font-size: 13.5px; font-weight: 600; }
details.entry { border-top: 1px solid var(--line); padding: 7px 0; margin-top: 7px; }
details.entry > summary { cursor: pointer; font-weight: 500; display: flex; align-items: center; gap: 8px; }
details.entry .ic { margin: 0; }
.foot { margin-top: 14px; font-size: 12.5px; color: var(--muted); }
.foot a { color: var(--muted); }
.foot p { margin: 2px 0; }

/* New and reworked champions: dated rows, same rhythm as the Tech News feed */
.row { display: grid; grid-template-columns: 76px minmax(0, 1fr); column-gap: 14px; padding: 14px 16px; margin-bottom: 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; }
.row:hover { border-color: var(--muted); }
.row { position: relative; }
.row .title::after { content: ""; position: absolute; inset: 0; border-radius: 8px; }  /* whole row opens the article */
.row:hover .title { color: var(--signal); }
.row .title:focus-visible { outline: none; }
.row .title:focus-visible::after { outline: 2px solid var(--signal); outline-offset: 2px; }
.row .snip { margin: 5px 0 0; color: var(--muted); font-size: 14.5px; max-width: 70ch; }
.empty { text-align: center; color: var(--muted); padding: 48px 12px; }

@media (pointer: coarse) {
  button { padding: 10px 14px; }
  .chip { padding: 8px 10px; }
  summary { padding: 6px 0; }
}
@media (max-width: 760px) {
  html { scroll-padding-top: 16px; }
  #views, main { padding-left: 16px; padding-right: 16px; }
  #vfilter { margin-left: 0; }
  .patch-card { padding: 14px; }
  .head { flex-direction: column; gap: 2px; }
  .row { grid-template-columns: minmax(0, 1fr); }
}
</style>
</head>
<body>
<header>
  <nav class="switch" aria-label="Section"><a href="/">Tech News</a><a href="/lol" aria-current="page">League News</a></nav>
  <h1 class="sr">League News</h1>
  <span class="seg" role="group" aria-label="Game"><button id="lol" aria-pressed="true">League of Legends</button><button id="wr" aria-pressed="false">Wild Rift</button></span>
  <input id="q" type="search" name="q" placeholder="Search champion or item" aria-label="Search champion or item" aria-keyshortcuts="/" title="Press / to search" autocomplete="off" spellcheck="false">
  <button id="refresh" aria-keyshortcuts="r" title="Fetch new patches (r)">Refresh</button>
  <span id="status" role="status" aria-live="polite"></span>
</header>
<nav id="views" aria-label="League views">
  <button class="tab" id="v-patches">Patches</button>
  <button class="tab" id="v-champions">New and reworked champions</button>
  <span id="vfilter" class="seg" role="group" aria-label="Show"><button data-v="">All changes</button><button data-v="buff">Buffs</button><button data-v="nerf">Nerfs</button></span>
</nav>
<main id="main"></main>
<button id="to-top" aria-label="Back to top" title="Back to top (t)" hidden>↑ Top</button>
<script src="/common.js"></script>
<script>
const [S, save] = loadState('newsui.lol.v1', { game: 'lol', view: 'patches', verdict: '', q: '' });
if (!['lol', 'wr'].includes(S.game)) S.game = 'lol';
if (!['patches', 'champions'].includes(S.view)) S.view = 'patches';
if (!['', 'buff', 'nerf'].includes(S.verdict)) S.verdict = '';
let panelSeq = 0;
// Per patch (by URL): which chip panel and whether "All details" is open. Kept across redraws so filtering,
// searching and the background reload do not close what you are reading.
const UI = { open: {}, details: {} };
const P = createPage({
  url: () => '/api/lol',
  initial: { lol: { patches: [], champions: [] }, wr: { patches: [], champions: [] }, refreshing: false },
  render: () => render(),
});

const fmt = ts => new Date(ts * 1000).toLocaleDateString([], { year: 'numeric', month: 'short', day: 'numeric' });
const fmtShort = ts => new Date(ts * 1000).toLocaleDateString([], { month: 'short', day: 'numeric', year: new Date(ts * 1000).getFullYear() === new Date().getFullYear() ? undefined : 'numeric' });
const dateEl = (ts, short) => el('time', { textContent: short ? fmtShort(ts) : fmt(ts), dateTime: new Date(ts * 1000).toISOString() });

const hit = (words, q) => !q || words.join(' ').toLowerCase().includes(q);

const MARK = { buff: '▲ ', nerf: '▼ ', mixed: '◆ ', adjust: '' };
// Icons come from Riot's public CDN (Data Dragon), or riftpatchnotes.com where Riot has none; no other host is accepted.
const ico = e => e.icon && /^https:\/\/(ddragon\.leagueoflegends\.com|www\.riftpatchnotes\.com)\//.test(e.icon)
  ? [el('img', { className: 'ic ' + e.kind, src: e.icon, alt: '', width: 16, height: 16, loading: 'lazy', referrerPolicy: 'no-referrer' })] : [];
const WORD = { buff: 'Buff', nerf: 'Nerf', mixed: 'Mixed', adjust: 'Adjusted' };

// One champion/item/rune: reason, every change, and where the buff/nerf label came from.
function entryBody(e) {
  const box = el('div', { className: 'body' });
  const src = e.verdict_source === 'inferred' ? 'guessed from the numbers' : 'label from ' + e.verdict_source;
  box.append(el('div', { className: 'note', textContent: `${WORD[e.verdict]} (${src})` + (e.guess && e.guess !== e.verdict && e.verdict_source !== 'inferred' ? `; numbers alone suggest ${WORD[e.guess].toLowerCase()}` : '') }));
  if (e.reason) box.append(el('p', { className: 'reason', textContent: e.reason }));
  for (const c of e.changes) {
    const text = (c.verdict === 'buff' ? '▲ ' : c.verdict === 'nerf' ? '▼ ' : '') + (c.stat || c.before ? `${c.stat ? c.stat + ': ' : ''}${c.before} ⇒ ${c.after}` : c.after);
    box.append(el('div', { className: 'change' }, ...(c.group ? [el('span', { className: 'grp', textContent: c.group + ': ' })] : []),
      el('span', { className: c.verdict === 'buff' ? 'up' : c.verdict === 'nerf' ? 'down' : '', textContent: text })));
  }
  if (!e.changes.length && !e.reason) box.append(el('div', { className: 'note', textContent: 'No details in the patch note.' }));
  return box;
}
function chip(e, onpick, controls, key) {
  const b = el('button', { className: 'chip ' + e.verdict, title: 'Show the changes', onclick: onpick }, ...ico(e), MARK[e.verdict] + e.name);
  b.setAttribute('aria-expanded', 'false'); b.setAttribute('aria-controls', controls);
  return keyed(b, key);
}
// Clicking a chip shows that entry's changes under the chips; clicking it again hides them.
function openPanel(card, e, btn) {
  card.querySelectorAll('.chip').forEach(c => { c.classList.remove('active'); c.setAttribute('aria-expanded', 'false'); });
  btn.classList.add('active'); btn.setAttribute('aria-expanded', 'true');
  card.panel.hidden = false;
  card.panel.replaceChildren(el('div', { className: 'phead' }, el('span', { className: 'badge ' + e.verdict, textContent: WORD[e.verdict] }), ...ico(e), el('strong', { textContent: e.name })), entryBody(e));
}
function pick(card, url, e, btn) {
  const key = e.kind + '|' + e.name;
  if (UI.open[url] === key) {
    UI.open[url] = null; card.panel.hidden = true;
    card.querySelectorAll('.chip').forEach(c => { c.classList.remove('active'); c.setAttribute('aria-expanded', 'false'); });
  } else { UI.open[url] = key; openPanel(card, e, btn); }
}
function detailsOf(entries, url) {
  const d = el('details', { className: 'patch' }, el('summary', { textContent: 'All details' }));
  // Rows are built on first open: a collapsed list would otherwise create hundreds of icons nobody looks at.
  const fill = () => {
    if (d.dataset.built) return;
    d.dataset.built = '1';
    for (const e of entries) {
      d.append(el('details', { className: 'entry' },
        el('summary', {}, el('span', { className: 'badge ' + e.verdict, textContent: WORD[e.verdict] }), ...ico(e), e.name), entryBody(e)));
    }
  };
  d.addEventListener('toggle', () => { UI.details[url] = d.open; if (d.open) fill(); });
  if (UI.details[url]) { d.open = true; fill(); }
  return d;
}
function link(a) {
  const x = el('a', { className: 'title', textContent: a.title, rel: 'noopener noreferrer', target: '_blank' });
  if (/^https?:\/\//i.test(a.url)) x.href = a.url;
  return x;
}
// A thin bar split by verdict shows at a glance which way a patch leans; the counts are repeated as text.
function verdictBar(list) {
  const n = v => list.filter(e => e.verdict === v).length;
  const parts = [['buff', 'buffed'], ['nerf', 'nerfed'], ['mixed', 'mixed'], ['adjust', 'adjusted']].filter(([v]) => n(v));
  const text = parts.map(([v, w]) => `${n(v)} ${w}`).join(', ');
  const bar = el('div', { className: 'bar', role: 'img' }, ...parts.map(([v]) => { const s = el('i', { className: v }); s.style.flex = n(v); return s; }));
  bar.setAttribute('aria-label', text);
  return [bar, el('div', { className: 'counts', textContent: text })];
}

function render() {
  const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  $('#q').value = S.q;
  $('#lol').setAttribute('aria-pressed', S.game === 'lol');
  $('#wr').setAttribute('aria-pressed', S.game === 'wr');
  const q = S.q.trim().toLowerCase(), g = P.data[S.game], main = $('#main');
  main.replaceChildren();

  for (const v of ['patches', 'champions']) $('#v-' + v).setAttribute('aria-pressed', S.view === v);
  $('#vfilter').hidden = S.view !== 'patches';
  document.querySelectorAll('#vfilter button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === S.verdict));
  const empty = () => main.append(el('div', { className: 'empty', textContent: P.data.refreshing ? 'Fetching the latest patches…' : S.q.trim() || S.verdict ? 'Nothing matches. Clear the search or choose All changes.' : 'Nothing here yet. Press Refresh to fetch patches.' }));

  if (S.view === 'champions') {
    const champs = g.champions.filter(a => hit([a.title, a.summary], q));
    if (!champs.length) empty();
    for (const a of champs) main.append(el('article', { className: 'row' }, dateEl(a.ts, true),
      el('div', {}, link(a), ...(a.summary ? [el('p', { className: 'snip', textContent: a.summary })] : []))));
  } else {
    const sel = e => S.verdict === '' || e.verdict === S.verdict || e.verdict === 'mixed';
    const patches = [];
    for (const a of g.patches) {
      const titleHit = hit([a.title], q), named = a.details.filter(e => hit([e.name], q));
      if (q && !titleHit && !named.length) continue;
      const entries = (q && named.length ? named : a.details).filter(sel);
      if (S.verdict && !entries.length) continue;
      patches.push([a, entries]);
    }
    if (!patches.length) empty();
    for (const [a, entries] of patches) {
      const panel = el('div', { className: 'panel', hidden: true, id: 'panel-' + (++panelSeq) });
      const buttons = new Map();
      const card = el('article', { className: 'patch-card' }, el('div', { className: 'head' }, link(a), dateEl(a.ts)));
      card.panel = panel;
      for (const [kind, label] of [['champions', 'Champions'], ['items', 'Items'], ['runes', 'Runes']]) {
        const list = entries.filter(e => e.kind === kind);
        if (!list.length) continue;
        card.append(el('section', { className: 'kind' },
          el('div', { className: 'kind-h' }, label, el('span', { textContent: String(list.length) })),
          ...verdictBar(list),
          el('div', { className: 'chips' }, ...list.map(e => {
            const b = chip(e, ev => pick(card, a.url, e, ev.currentTarget), panel.id, a.url + '|' + e.kind + '|' + e.name);
            buttons.set(e, b);
            return b;
          }))));
      }
      card.append(panel);
      const reopen = entries.find(e => e.kind + '|' + e.name === UI.open[a.url]);
      if (reopen) openPanel(card, reopen, buttons.get(reopen));
      if (!a.parsed) card.append(el('div', { className: 'foot', textContent: 'Details are not loaded yet. Press Refresh.' }));
      if (entries.length) card.append(detailsOf(entries, a.url));
      const foot = el('div', { className: 'foot' });
      if (a.other.length) foot.append(el('p', { textContent: 'Also in this patch: ' + a.other.join(', ') }));
      if (a.labels_url && /^https:\/\//.test(a.labels_url)) foot.append(el('p', {}, 'Buff and nerf labels from ',
        el('a', { href: a.labels_url, target: '_blank', rel: 'noopener noreferrer', textContent: 'riftpatchnotes.com' }), '; where it has none, they are guessed from the numbers.'));
      if (foot.children.length) card.append(foot);
      main.append(card);
    }
  }

  P.renderStatus();
  if (fk) document.querySelectorAll('[data-key]').forEach(n => { if (n.dataset.key === fk) n.focus({ preventScroll: true }); });
}

$('#lol').addEventListener('click', () => { S.game = 'lol'; save(); render(); });
$('#wr').addEventListener('click', () => { S.game = 'wr'; save(); render(); });
for (const v of ['patches', 'champions']) $('#v-' + v).addEventListener('click', () => { S.view = v; save(); render(); scrollTo(0, 0); });
document.querySelectorAll('#vfilter button').forEach(b => b.addEventListener('click', () => { S.verdict = b.dataset.v; save(); render(); }));
$('#q').addEventListener('input', e => { S.q = e.target.value; save(); render(); });
$('#refresh').addEventListener('click', P.refresh);
$('#to-top').addEventListener('click', toTop);
addEventListener('scroll', () => { $('#to-top').hidden = scrollY < 500; }, { passive: true });
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); } else if (e.key === 'r') P.refresh(); else if (e.key === 't') toTop();
});

P.load();
</script>
</body>
</html>
