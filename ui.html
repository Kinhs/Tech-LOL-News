<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f1f4f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101722" media="(prefers-color-scheme: dark)">
<title>Tech News</title>
<link rel="stylesheet" href="/common.css">
<style>
html { scroll-padding-top: calc(var(--hdr) + 56px); }

.layout { max-width: 820px; margin: 0 auto; padding: 18px 20px 40px; }

/* Filter bar above the feed: Source button, topic chips, short key hints */
.filters { margin-bottom: 8px; }
.filter-row { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 10px; }
#source-btn { display: inline-flex; align-items: center; gap: 8px; }
#source-btn b { font-weight: 600; color: var(--signal); max-width: 22ch; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#source-btn[data-active] { border-color: var(--signal); background: var(--signal-bg); }
#multi { font-size: 13px; padding: 6px 10px; }
.hint { margin: 0 0 0 auto; font-size: 12.5px; color: var(--muted); }
kbd { font: inherit; font-size: 11.5px; border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; background: var(--panel); }
#topics { display: flex; flex-wrap: wrap; gap: 6px; }
.tchip { display: inline-flex; align-items: center; gap: 7px; padding: 5px 11px; border-radius: 6px; background: var(--panel); white-space: nowrap; }
.tchip span { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; }
.tchip[aria-pressed=true] { font-weight: 600; }
.tchip[aria-pressed=true] span { color: var(--signal); }

/* Floating dock: appears once the filter bar has scrolled away */
#dock { position: fixed; right: 18px; bottom: calc(18px + env(safe-area-inset-bottom)); z-index: 9; display: flex; gap: 4px; padding: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 8px 24px rgba(0, 0, 0, .28); }
#dock[hidden] { display: none; }
#dock button { border-color: transparent; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
#dock button:hover { border-color: var(--signal); }
#dock b { font-weight: 600; color: var(--signal); max-width: 14ch; overflow: hidden; text-overflow: ellipsis; }
#dock button[data-active] { background: var(--signal-bg); }

/* Source dialog */
dialog { border: 1px solid var(--line); border-radius: 12px; background: var(--panel); color: var(--text); padding: 0; width: min(580px, 92vw); max-height: min(80vh, 640px); }
dialog[open] { display: flex; flex-direction: column; }
dialog::backdrop { background: rgba(8, 12, 18, .62); }
.dlg-head { display: flex; align-items: center; gap: 10px; padding: 14px 16px; border-bottom: 1px solid var(--line); }
.dlg-head h2 { margin: 0; font-size: 16px; flex: none; }
.dlg-head input { flex: 1 1 auto; }
#topic-list { display: flex; flex-wrap: wrap; gap: 6px; overflow-y: auto; padding: 14px 16px 18px; }
.dlg-head .spacer { flex: 1; }
#source-list { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 10px; overflow-y: auto; padding: 10px 12px 14px; }
.opt { display: flex; justify-content: space-between; align-items: center; gap: 8px; text-align: left; border: 0; border-left: 3px solid transparent; border-radius: 0 6px 6px 0; padding: 7px 9px; min-width: 0; }
.opt:hover { background: var(--hover); }
.opt .name { display: flex; align-items: center; gap: 8px; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.opt .n { color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; flex: none; }
.opt[aria-pressed=true] { background: var(--signal-bg); border-left-color: var(--signal); font-weight: 600; }
.opt[aria-pressed=true] .n { color: var(--signal); }

main { min-width: 0; }
.day { position: sticky; top: var(--hdr); z-index: 2; background: var(--bg); padding: 14px 4px 10px; margin: 0; font-size: 14px; font-weight: 700; }
.day span { font-weight: 400; color: var(--muted); margin-left: 8px; font-variant-numeric: tabular-nums; }
.story { display: grid; grid-template-columns: 78px minmax(0, 1fr) auto; grid-template-areas: "when body star"; column-gap: 12px; padding: 14px 14px 14px 12px; margin: 0 0 10px; background: var(--panel); border: 1px solid var(--line); border-left: 3px solid var(--line); border-radius: 8px; }
.story:hover { border-color: var(--muted); border-left-color: var(--muted); }
/* Unread: accent bar, tinted block, bold headline, filled dot. Read: plain block, light headline, hollow dot, greyed icon. */
.story:not(.read) { border-left-color: var(--signal); background: linear-gradient(var(--unread-bg), var(--unread-bg)), var(--panel); }
.story:not(.read):hover { border-left-color: var(--signal); }
.when { grid-area: when; display: flex; align-items: center; gap: 0; color: var(--muted); font-size: 12.5px; font-variant-numeric: tabular-nums; white-space: nowrap; margin-top: 1px; }
.story:not(.read) .when time { color: var(--text); font-weight: 600; }
.dot { position: relative; width: 26px; height: 26px; padding: 0; border: 0; background: none; flex: none; }
.dot::before { content: ""; position: absolute; inset: 8px; border-radius: 50%; background: var(--signal); }
.story.read .dot::before { background: transparent; box-shadow: inset 0 0 0 1.5px var(--muted); }
.dot:hover::before { transform: scale(1.25); }
.body { grid-area: body; min-width: 0; }
.title { display: block; font-family: var(--serif); font-weight: 600; font-size: 18px; line-height: 1.3; color: var(--text); text-decoration: none; scroll-margin-top: calc(var(--hdr) + 60px); }
.title:hover, .story:hover .title { color: var(--signal); }
/* Stretched link: the headline link covers the whole block, so clicking anywhere on a story opens it. */
.story { position: relative; }
.title::after { content: ""; position: absolute; inset: 0; border-radius: 8px; }
.title:focus-visible { outline: none; }
.title:focus-visible::after { outline: 2px solid var(--signal); outline-offset: 2px; }
.dot, .star, .chip { position: relative; z-index: 1; }
.story:not(.read) .title { font-weight: 700; }
.story.read .title { font-weight: 400; color: var(--muted); }
.story.read:hover .title { color: var(--signal); }
.story.read .fav { filter: grayscale(1); opacity: .55; }
.src { display: flex; align-items: center; gap: 7px; margin-top: 5px; color: var(--muted); font-size: 13px; }
.fav { width: 16px; height: 16px; border-radius: 3px; flex: none; object-fit: contain; }
span.fav { background: var(--signal-bg); color: var(--signal); font-size: 10px; font-weight: 700; line-height: 16px; text-align: center; }
.snip { margin: 6px 0 0; color: var(--muted); font-size: 14.5px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tags { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 1px 8px; border-radius: 4px; color: var(--muted); background: transparent; }
.chip:hover { color: var(--signal); }
.star { grid-area: star; align-self: start; border: 0; background: none; font-size: 19px; line-height: 1; padding: 4px 6px; color: var(--muted); }
.star:hover { color: var(--star); }
.star[aria-pressed=true] { color: var(--star); background: none; }
.title, .snip { overflow-wrap: anywhere; }  /* a long URL or code string must not widen the row */

#empty, #more { text-align: center; color: var(--muted); padding: 48px 12px; }
#empty p { margin: 0 0 12px; }
#more button { margin-top: 8px; }

@media (pointer: coarse) {
  button { padding: 10px 14px; }
  .chip { padding: 8px 10px; }
  .tchip, .opt { padding: 9px 12px; }
  .star { padding: 10px 12px; margin: -6px -6px 0 0; }
  .dot { width: 40px; height: 40px; }
  .dot::before { inset: 15px; }
  .hint { display: none; }
}
@media (max-width: 760px) {
  .day { top: 0; padding-left: 2px; }
  html { scroll-padding-top: 56px; }
  .title { scroll-margin-top: 70px; }
  .layout { padding: 12px 16px 32px; }
  .hint { display: none; }
  #topics { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 6px; scroll-snap-type: x proximity; }
  .tchip { flex: none; scroll-snap-align: start; }
  #source-list { grid-template-columns: 1fr; }
  #dock { left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); justify-content: stretch; }
  #dock button { flex: 1; justify-content: center; }
  #dock .t-top { flex: none; }
  .story { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "when star" "body body"; padding: 10px 10px 12px 8px; }
}
</style>
</head>
<body>
<header>
  <nav class="switch" aria-label="Section"><a href="/" aria-current="page">Tech News</a><a href="/lol">League News</a></nav>
  <h1 class="sr">Tech News</h1>
  <input id="q" type="search" name="q" placeholder="Search stories" aria-label="Search stories" aria-keyshortcuts="/" title="Press / to search" autocomplete="off" spellcheck="false">
  <select id="days" aria-label="Time range">
    <option value="1">Last 24 hours</option><option value="3">Last 3 days</option><option value="7">Last 7 days</option><option value="30">Last 30 days</option>
  </select>
  <button id="unread" aria-pressed="false">Unread</button>
  <button id="starred" aria-pressed="false">★ Starred</button>
  <button id="refresh" aria-keyshortcuts="r" title="Fetch new stories (r)">Refresh</button>
  <span id="status" role="status" aria-live="polite"></span>
</header>
<div class="layout">
  <section class="filters" aria-label="Filters">
    <div class="filter-row">
      <button id="source-btn" aria-haspopup="dialog" title="Show stories from one source">Source <b id="source-now">All sources</b> ▾</button>
      <button id="multi" aria-pressed="false" title="Pick several topics at once (Ctrl/Cmd+click does the same)">Select several topics</button>
      <p class="hint"><kbd>j</kbd> <kbd>k</kbd> next / previous <kbd>s</kbd> star <kbd>/</kbd> search <kbd>r</kbd> refresh <kbd>t</kbd> top</p>
    </div>
    <div id="topics" role="group" aria-label="Topics"></div>
  </section>
  <main id="list"></main>
</div>
<div id="dock" role="toolbar" aria-label="Quick navigation" hidden>
  <button id="dock-topics" aria-haspopup="dialog">Topics <b id="dock-topics-now">All</b></button>
  <button id="dock-source" aria-haspopup="dialog">Source <b id="dock-source-now">All</b></button>
  <button id="dock-top" class="t-top" aria-label="Back to top" title="Back to top (t)">↑ Top</button>
</div>
<dialog id="topic-dialog" aria-labelledby="topic-title">
  <div class="dlg-head">
    <h2 id="topic-title">Topics</h2>
    <button id="multi2" aria-pressed="false" title="Pick several topics at once">Select several</button>
    <span class="spacer"></span>
    <button id="topic-close" aria-label="Close">Done</button>
  </div>
  <div id="topic-list" role="group" aria-label="Topics"></div>
</dialog>
<dialog id="source-dialog" aria-labelledby="source-title">
  <div class="dlg-head">
    <h2 id="source-title">Source</h2>
    <input id="source-q" type="search" placeholder="Find a source" aria-label="Find a source" autocomplete="off" spellcheck="false">
    <button id="source-close" aria-label="Close">Close</button>
  </div>
  <div id="source-list" role="group" aria-label="Sources"></div>
</dialog>
<script src="/common.js"></script>
<script>
const [S, save] = loadState('newsui.v1', { topics: [], q: '', unread: false, starred: false, source: '', days: 3, multi: false });
if (!Array.isArray(S.topics)) S.topics = [];
let shown = 300;
const hhmm = ts => new Date(ts * 1000).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
const P = createPage({
  url: () => '/api/items?days=' + S.days,
  initial: { items: [], topics: [], topic_icons: {}, icons: {}, sources: [], last_refresh: 0, refreshing: false },
  render: () => render(),
  status: d => d.last_refresh ? 'Updated ' + hhmm(d.last_refresh) : '',
});

function matches(i, skipTopics, skipSource) {
  if (!skipTopics && S.topics.length && !i.tags.some(t => S.topics.includes(t))) return false;
  if (!skipSource && S.source && i.source !== S.source) return false;
  if (S.unread && i.read) return false;
  if (S.starred && !i.starred) return false;
  const q = S.q.trim().toLowerCase();
  return !q || (i.title + ' ' + i.summary).toLowerCase().includes(q);
}
const filtersOn = () => !!(S.topics.length || S.source || S.unread || S.starred || S.q.trim());
function clearFilters() { Object.assign(S, { topics: [], source: '', unread: false, starred: false, q: '' }); save(); shown = 300; render(); }

function render() {
  const fk = document.activeElement && document.activeElement.dataset ? document.activeElement.dataset.key : null;
  $('#multi').setAttribute('aria-pressed', S.multi);
  $('#q').value = S.q; $('#days').value = S.days; $('#unread').setAttribute('aria-pressed', S.unread); $('#starred').setAttribute('aria-pressed', S.starred);

  const counts = {};
  P.data.items.filter(i => matches(i, true)).forEach(i => i.tags.forEach(t => counts[t] = (counts[t] || 0) + 1));
  const total = P.data.items.filter(i => matches(i, true)).length;
  // The same chips appear in the filter bar and in the Topics dialog the dock opens.
  const chips = prefix => {
    const all = el('button', { className: 'tchip', onclick: () => { S.topics = []; save(); shown = 300; closeDialog('topic-dialog'); render(); scrollTo(0, 0); } },
      'All topics', el('span', {}, String(total)));
    all.setAttribute('aria-pressed', !S.topics.length);
    return [keyed(all, prefix + 'topic:all'), ...P.data.topics.filter(t => counts[t] || S.topics.includes(t)).map(t => {
      const b = el('button', { className: 'tchip', onclick: e => pickTopic(t, e) }, emoji(t) + t, el('span', {}, String(counts[t] || 0)));
      b.setAttribute('aria-pressed', S.topics.includes(t));
      return keyed(b, prefix + 'topic:' + t);
    })];
  };
  $('#topics').replaceChildren(...chips('i:'));
  $('#topic-list').replaceChildren(...chips('d:'));
  $('#multi2').setAttribute('aria-pressed', S.multi);
  renderDock();
  renderSources();

  const items = P.data.items.filter(i => matches(i));
  const list = $('#list');
  list.replaceChildren();
  if (!items.length) list.append(emptyState());
  // Group by calendar day; each day heading says how many stories and how many are still unread.
  const groups = [];
  for (const i of items.slice(0, shown)) {
    const d = new Date(i.ts * 1000).toDateString();
    if (!groups.length || groups[groups.length - 1].d !== d) groups.push({ d, ts: i.ts, items: [] });
    groups[groups.length - 1].items.push(i);
  }
  for (const g of groups) {
    const unread = g.items.filter(i => !i.read).length;
    list.append(el('h2', { className: 'day' }, dayLabel(g.d, g.ts), el('span', {}, `${g.items.length} ${g.items.length === 1 ? 'story' : 'stories'}${unread ? ', ' + unread + ' unread' : ''}`)));
    g.items.forEach(i => list.append(card(i)));
  }
  if (items.length > shown) {
    const more = keyed(el('button', { textContent: 'Show more', onclick: () => { shown += 300; render(); } }), 'more');
    list.append(el('div', { id: 'more' }, `${items.length - shown} more stories`, el('br'), more));
  }

  P.renderStatus();
  if (fk) document.querySelectorAll('[data-key]').forEach(n => { if (n.dataset.key === fk) n.focus({ preventScroll: true }); });
}

// Source dialog: every source with its icon and story count, filterable; click one to show only it.
function renderSources() {
  const counts = {};
  P.data.items.filter(i => matches(i, false, true)).forEach(i => counts[i.source] = (counts[i.source] || 0) + 1);
  const find = $('#source-q').value.trim().toLowerCase();
  const pick = s => { S.source = s; save(); shown = 300; $('#source-dialog').close(); render(); scrollTo(0, 0); };
  const row = (s, label, n, icon) => {
    const b = el('button', { className: 'opt', onclick: () => pick(S.source === s ? '' : s) }, el('span', { className: 'name' }, ...(icon ? [icon] : []), label), el('span', { className: 'n' }, String(n)));
    b.setAttribute('aria-pressed', S.source === s);
    return keyed(b, 'src:' + s);
  };
  const names = P.data.sources.filter(s => (counts[s] || s === S.source) && (!find || s.toLowerCase().includes(find))).sort((a, b) => a.localeCompare(b));
  $('#source-list').replaceChildren(...(find ? [] : [row('', 'All sources', Object.values(counts).reduce((a, b) => a + b, 0))]),
    ...names.map(s => row(s, s, counts[s] || 0, favicon(s))));
  $('#source-now').textContent = S.source || 'All sources';
  S.source ? $('#source-btn').setAttribute('data-active', '') : $('#source-btn').removeAttribute('data-active');
}

const closeDialog = id => { const d = document.getElementById(id); if (d.open) d.close(); };
function renderDock() {
  const n = S.topics.length;
  $('#dock-topics-now').textContent = n === 0 ? 'All' : n === 1 ? S.topics[0] : n + ' selected';
  $('#dock-source-now').textContent = S.source || 'All';
  n ? $('#dock-topics').setAttribute('data-active', '') : $('#dock-topics').removeAttribute('data-active');
  S.source ? $('#dock-source').setAttribute('data-active', '') : $('#dock-source').removeAttribute('data-active');
}

function emptyState() {
  if (P.data.refreshing) return el('div', { id: 'empty' }, el('p', { textContent: 'Fetching the latest stories…' }));
  if (filtersOn()) return el('div', { id: 'empty' }, el('p', { textContent: 'No stories match these filters.' }), keyed(el('button', { textContent: 'Clear filters', onclick: clearFilters }), 'clear'));
  return el('div', { id: 'empty' }, el('p', { textContent: 'No stories yet. Press Refresh to fetch the latest.' }));
}

const emoji = t => (P.data.topic_icons[t] ? P.data.topic_icons[t] + ' ' : '');
// Favicons are cached by the server and served from /icons/; sources without one get their first letter.
const favicon = s => P.data.icons[s] && /^\/icons\/[a-z0-9-]+\.(png|ico|gif|jpg)$/.test(P.data.icons[s])
  ? el('img', { className: 'fav', src: P.data.icons[s], alt: '', width: 16, height: 16, loading: 'lazy' })
  : el('span', { className: 'fav', textContent: s[0].toUpperCase() });

function card(i) {
  const safe = /^https?:\/\//i.test(i.url);
  const a = el('a', { className: 'title', textContent: i.title, rel: 'noopener noreferrer', target: '_blank' });
  if (safe) a.href = i.url;
  keyed(a, 't:' + i.url);
  const unreadNote = el('span', { className: 'sr', textContent: 'Unread. ' });
  const dot = keyed(el('button', { className: 'dot', onclick: () => { mark(i, { read: !i.read }); render(); } }), 'r:' + i.url);
  const labelDot = () => { const t = i.read ? 'Mark as unread' : 'Mark as read'; dot.title = t; dot.setAttribute('aria-label', t + ': ' + i.title); };
  labelDot();
  const markRead = () => { if (!i.read) { mark(i, { read: true }); a.closest('article').classList.add('read'); unreadNote.remove(); labelDot(); } };
  a.addEventListener('click', markRead); a.addEventListener('auxclick', markRead);
  const star = el('button', { className: 'star', textContent: i.starred ? '★' : '☆', title: 'Star', onclick: () => { mark(i, { starred: !i.starred }); render(); } });
  star.setAttribute('aria-pressed', i.starred);
  star.setAttribute('aria-label', (i.starred ? 'Unstar: ' : 'Star: ') + i.title);
  keyed(star, 's:' + i.url);
  const body = el('div', { className: 'body' },
    ...(i.read ? [] : [unreadNote]),
    a,
    el('div', { className: 'src' }, favicon(i.source), i.source),
    ...(i.summary ? [el('p', { className: 'snip', textContent: i.summary })] : []),
    el('div', { className: 'tags' }, ...i.tags.map(t => keyed(el('button', { className: 'chip', textContent: emoji(t) + t, onclick: e => pickTopic(t, e) }), 'c:' + i.url + ':' + t))));
  return el('article', { className: 'story' + (i.read ? ' read' : '') },
    el('div', { className: 'when' }, el('time', { textContent: hhmm(i.ts), dateTime: new Date(i.ts * 1000).toISOString() }), dot), body, star);
}

function mark(i, patch) { Object.assign(i, patch); post('/api/mark', { url: i.url, ...patch }).catch(() => P.flash("Couldn't save that change. Is the server still running?")); }
// Plain click: only this topic (clicking it again clears) and jump to top. Ctrl/Cmd-click: add/remove, stay in place.
function pickTopic(t, e) {
  const multi = e.ctrlKey || e.metaKey || S.multi;
  if (multi) toggle(S.topics, t);
  else S.topics = S.topics.length === 1 && S.topics[0] === t ? [] : [t];
  save(); shown = 300; if (!multi) closeDialog('topic-dialog'); render();
  if (!multi) scrollTo(0, 0);
}
function toggle(arr, v) { const k = arr.indexOf(v); k < 0 ? arr.push(v) : arr.splice(k, 1); }
function dayLabel(d, ts) {
  const t = new Date(); if (d === t.toDateString()) return 'Today';
  t.setDate(t.getDate() - 1); if (d === t.toDateString()) return 'Yesterday';
  return new Intl.DateTimeFormat([], { weekday: 'long', month: 'long', day: 'numeric' }).format(new Date(ts * 1000));
}

// j / k move keyboard focus between story headlines; s stars the focused story.
function moveStory(step) {
  const links = [...document.querySelectorAll('article .title')];
  if (!links.length) return;
  const at = links.indexOf(document.activeElement);
  links[Math.min(links.length - 1, Math.max(0, at < 0 ? (step > 0 ? 0 : links.length - 1) : at + step))].focus();
}

let searchTimer = null;
$('#q').addEventListener('input', e => { S.q = e.target.value; save(); clearTimeout(searchTimer); searchTimer = setTimeout(() => { shown = 300; render(); }, 150); });
const toggleMulti = () => { S.multi = !S.multi; save(); $('#multi').setAttribute('aria-pressed', S.multi); $('#multi2').setAttribute('aria-pressed', S.multi); };
$('#multi').addEventListener('click', toggleMulti);
$('#multi2').addEventListener('click', toggleMulti);
$('#days').addEventListener('change', e => { S.days = +e.target.value; save(); P.reload(); });
$('#source-q').addEventListener('input', renderSources);
$('#source-close').addEventListener('click', () => $('#source-dialog').close());
// Dock: reachable from anywhere once the filter bar has scrolled out of view
const openSource = () => { $('#source-q').value = ''; renderSources(); $('#source-dialog').showModal(); $('#source-q').focus(); };
$('#dock-source').addEventListener('click', openSource);
$('#source-btn').addEventListener('click', openSource);
$('#dock-topics').addEventListener('click', () => $('#topic-dialog').showModal());
$('#topic-close').addEventListener('click', () => $('#topic-dialog').close());
$('#topic-dialog').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });
$('#dock-top').addEventListener('click', toTop);
new IntersectionObserver(([en]) => { $('#dock').hidden = en.isIntersecting; }, { rootMargin: '-60px 0px 0px 0px' }).observe($('.filters'));
$('#source-dialog').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.close(); });  // click on the dimmed backdrop
$('#unread').addEventListener('click', () => { S.unread = !S.unread; save(); render(); });
$('#starred').addEventListener('click', () => { S.starred = !S.starred; save(); render(); });
$('#refresh').addEventListener('click', P.refresh);
addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey || /^(INPUT|SELECT|TEXTAREA)$/.test(e.target.tagName)) return;
  if (e.key === '/') { e.preventDefault(); $('#q').focus(); }
  else if (e.key === 'r') P.refresh();
  else if (e.key === 't') toTop();
  else if (e.key === 'j') moveStory(1);
  else if (e.key === 'k') moveStory(-1);
  else if (e.key === 's') { const st = document.activeElement.closest && document.activeElement.closest('article'); if (st) st.querySelector('.star').click(); }
});

P.load();
</script>
</body>
</html>
